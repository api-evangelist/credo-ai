versioned_entities:
  note: Three governance artifacts use an explicit base/version split — a *Base holds identity and a *Version
    holds published content, linked by base_id, with latest_published on the base.
  entities:
  - PolicyControlBase / PolicyControlVersion
  - PolicyPackBase / PolicyPackVersion
  - QuestionnaireBase / QuestionnaireVersion
  - Model / ModelVersion
polymorphism:
  entity_id: Many resources carry both a specific parent id (use_case_id / model_id / vendor_id) AND a
    generic entity_id, and a parallel /entities/{entity_id}/... path family exists. UseCase, Model and
    Vendor are three concrete faces of one polymorphic Entity, and entity_type_ids appears on CustomField,
    PolicyControl, PolicyControlBase, CustomPolicyPackBase and RiskScenario to say which faces a definition
    applies to.
  entity_type_endpoint: GET /entity_types
undocumented_surface_hint:
  field: TenantInfoResource.webhook_app_id
  note: Tenant info exposes a webhook_app_id, and the Swagger document declares a `webhooks` tag — but
    the tag carries ZERO operations and no webhook resource, subscription or event schema exists anywhere
    in either contract. A webhook capability is implied by the data model and unreachable through the
    published API.
