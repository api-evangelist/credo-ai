note: >-
  Rate limiting exists as a stated policy but is fully undisclosed: no numbers, no
  window, no scope, no headers, no documented 429, and no Retry-After. limit_count
  is 0 because nothing quantified is published — an honest zero, not an unchecked
  field. An agent integrating this API has no runtime signal to back off on and
  must discover the ceiling by hitting it. This is the single highest-leverage
  runtime-semantics gap in the Credo AI surface: the SDK ships max_retries=3 by
  default while the API publishes neither an idempotency key nor a retry signal,
  so a retried POST is unsafe by construction.
