openapi: 3.2.0
info:
  description: Credo AI server API
  title: Credo AI server Entity Types API
servers:
- url: /api/v2/credoai
tags:
- name: Entity Types
paths:
  /api/v2/entity_types:
    get:
      description: List the tenant's configured entity types
      operationId: CredoAIWeb.API.V2.EntityTypeController.index
      parameters:
      - description: Filter to workflow-enabled types
        in: query
        name: filter[workflow_enabled]
        required: false
        schema:
          type: boolean
      - description: Filter to questionnaire-enabled types
        in: query
        name: filter[questionnaires_enabled]
        required: false
        schema:
          type: boolean
      - description: Filter to document-enabled types
        in: query
        name: filter[documents_enabled]
        required: false
        schema:
          type: boolean
      - description: Filter to version-enabled types
        in: query
        name: filter[versions_enabled]
        required: false
        schema:
          type: boolean
      - description: Filter to model-card-enabled types
        in: query
        name: filter[model_card_enabled]
        required: false
        schema:
          type: boolean
      - description: Filter to reports-enabled types
        in: query
        name: filter[reports_enabled]
        required: false
        schema:
          type: boolean
      - description: Filter to review-enabled types
        in: query
        name: filter[reviews_enabled]
        required: false
        schema:
          type: boolean
      - description: Filter to comment-enabled types
        in: query
        name: filter[comments_enabled]
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/EntityTypesResponse'
        '401':
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Forbidden
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
      security:
      - Bearer: []
      summary: Credo AI web API V2 entity type controller index
      tags:
      - Entity Types
      x-summary-source: derived
components:
  schemas:
    ForbiddenError:
      properties:
        errors:
          description: Errors
          items:
            properties:
              code:
                description: an application-specific error code, expressed as a string value.
                type: integer
              detail:
                description: a human-readable explanation specific to this occurrence of the problem. Like title, this field’s value can be localized.
                type: string
              title:
                description: a short, human-readable summary of the problem that SHOULD NOT change from occurrence to occurrence of the problem, except for purposes of localization.
                type: string
            type: object
          type: array
      type: object
    AuthError:
      properties:
        errors:
          description: Errors
          items:
            properties:
              code:
                description: an application-specific error code, expressed as a string value.
                type: integer
              detail:
                description: a human-readable explanation specific to this occurrence of the problem. Like title, this field’s value can be localized.
                type: string
              title:
                description: a short, human-readable summary of the problem that SHOULD NOT change from occurrence to occurrence of the problem, except for purposes of localization.
                type: string
            type: object
          type: array
      type: object
    EntityTypeResource:
      description: ''
      properties:
        attributes:
          properties:
            comments_enabled:
              description: ''
              type: string
            display_name:
              description: ''
              type: string
            documents_enabled:
              description: ''
              type: string
            id:
              description: ''
              type: string
            inserted_at:
              description: ''
              type: string
            model_card_enabled:
              description: ''
              type: string
            name:
              description: ''
              type: string
            questionnaires_enabled:
              description: ''
              type: string
            reports_enabled:
              description: ''
              type: string
            reviews_enabled:
              description: ''
              type: string
            updated_at:
              description: ''
              type: string
            versions_enabled:
              description: ''
              type: string
            workflow_enabled:
              description: ''
              type: string
          type: object
        id:
          description: The JSON-API resource ID
          example: 64YUaLWSviHgibJaRWr3ZE
          type: string
        relationships:
          properties: {}
          type: object
        type:
          description: The JSON-API resource type
          example: entity_types
          type: string
      type: object
    EntityTypesResponse:
      description: A page of [EntityTypeResource](#entitytyperesource) results
      properties:
        data:
          description: Content with [EntityTypeResource](#entitytyperesource) objects
          items:
            $ref: '#/components/schemas/EntityTypeResource'
          type: array
        meta:
          properties:
            after:
              description: after cursor for the next page resources
              type: string
            before:
              description: before cursor for the previous page resources
              type: string
            limit:
              description: number of resources limit applied to this request
              type: integer
          type: object
      required:
      - data
      type: object
  securitySchemes:
    Bearer:
      in: header
      name: Authorization
      type: apiKey
