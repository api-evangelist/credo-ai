openapi: 3.2.0
info:
  description: Credo AI server API
  title: Credo AI server Entity Evidences API
servers:
- url: /api/v2/credoai
tags:
- name: entity_evidences
paths:
  /entities/{entity_id}/evidences:
    get:
      description: Retrieve a paginated list of the active evidences on the specified entity.
      operationId: CredoAIWeb.API.V2.Entity.EvidenceController.index
      parameters:
      - description: type match filter
        in: query
        name: filter[type]
        required: false
        schema:
          type: string
      - description: sort options
        in: query
        name: sort
        required: false
        x-example: -inserted_at
        schema:
          type: string
      - description: The unique ID of the entity.
        in: path
        name: entity_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/EvidencesResponse'
        '401':
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Forbidden
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Not Found
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
      security:
      - Bearer: []
      summary: Credo AI web API V2 entity evidence controller index
      tags:
      - entity_evidences
      x-summary-source: derived
  /entities/{entity_id}/evidences/{id}:
    delete:
      description: Deactivate a specific evidence item associated with an entity.
      operationId: CredoAIWeb.API.V2.Entity.EvidenceController.delete
      parameters:
      - description: The unique ID of the entity.
        in: path
        name: entity_id
        required: true
        schema:
          type: string
      - description: The unique ID of the evidence.
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: OK
        '401':
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Forbidden
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Not Found
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
      security:
      - Bearer: []
      summary: Credo AI web API V2 entity evidence controller delete
      tags:
      - entity_evidences
      x-summary-source: derived
    get:
      description: Retrieve detailed information about a specific evidence item on the specified entity.
      operationId: CredoAIWeb.API.V2.Entity.EvidenceController.show
      parameters:
      - description: The unique ID of the entity.
        in: path
        name: entity_id
        required: true
        schema:
          type: string
      - description: The unique ID of the evidence.
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/EvidenceResponse'
        '401':
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Forbidden
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Not Found
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
      security:
      - Bearer: []
      summary: Credo AI web API V2 entity evidence controller show
      tags:
      - entity_evidences
      x-summary-source: derived
components:
  schemas:
    EvidenceResource:
      description: ''
      properties:
        attributes:
          properties:
            control_key:
              description: Control key
              example: FAIR.C1
              type: string
            creator:
              description: Creator
              example:
                family_name: John
                given_name: Doe
                nickname: doe
              type: object
            data:
              description: value data,
              example:
                value: value
              type: object
            entity_id:
              description: ''
              type: string
            generated_at:
              description: Evidence generation time
              example: '2015-05-22T14:56:29.000Z'
              type: string
            hash_key:
              description: ''
              type: string
            inserted_at:
              description: insert time
              example: '2015-05-22T14:56:29.000Z'
              type: string
            label:
              description: label in the evidence requirement
              example:
                key: value
              type: object
            metadata:
              description: metadata
              example:
                key: value
              type: object
            model_id:
              description: model_id
              example: 4pEfRTw2RVVrouMbFH9tuH
              type: string
            model_version:
              description: ''
              type: string
            type:
              description: Evidence type
              example: text
              type: string
            use_case_id:
              description: use_case_id
              example: 64YUaLWSviHgibJaRWr3ZE
              type: string
          type: object
        id:
          description: The JSON-API resource ID
          example: 64YUaLWSviHgibJaRWr3ZE
          type: string
        relationships:
          properties:
            asset_links:
              properties:
                data:
                  properties:
                    id:
                      description: Related asset_links resource id
                      type: string
                    type:
                      description: Type of related asset_links resource
                      type: string
                  type: object
              type: object
            model:
              properties:
                data:
                  properties:
                    id:
                      description: Related model resource id
                      type: string
                    type:
                      description: Type of related model resource
                      type: string
                  type: object
              type: object
            policy_pack_links:
              properties:
                data:
                  properties:
                    id:
                      description: Related policy_pack_links resource id
                      type: string
                    type:
                      description: Type of related policy_pack_links resource
                      type: string
                  type: object
              type: object
          type: object
        type:
          description: The JSON-API resource type
          example: evidences
          type: string
      type: object
    EvidencesResponse:
      description: A collection of [EvidenceResource](#evidenceresource)
      properties:
        data:
          description: Content with [EvidenceResource](#evidenceresource) objects
          items:
            $ref: '#/components/schemas/EvidenceResource'
          type: array
      required:
      - data
      type: object
    ForbiddenError:
      properties:
        errors:
          description: Errors
          items:
            properties:
              code:
                description: an application-specific error code, expressed as a string value.
                type: integer
              detail:
                description: a human-readable explanation specific to this occurrence of the problem. Like title, this field’s value can be localized.
                type: string
              title:
                description: a short, human-readable summary of the problem that SHOULD NOT change from occurrence to occurrence of the problem, except for purposes of localization.
                type: string
            type: object
          type: array
      type: object
    AuthError:
      properties:
        errors:
          description: Errors
          items:
            properties:
              code:
                description: an application-specific error code, expressed as a string value.
                type: integer
              detail:
                description: a human-readable explanation specific to this occurrence of the problem. Like title, this field’s value can be localized.
                type: string
              title:
                description: a short, human-readable summary of the problem that SHOULD NOT change from occurrence to occurrence of the problem, except for purposes of localization.
                type: string
            type: object
          type: array
      type: object
    NotFoundError:
      properties:
        errors:
          description: Errors
          items:
            properties:
              code:
                description: an application-specific error code, expressed as a string value.
                type: integer
              detail:
                description: a human-readable explanation specific to this occurrence of the problem. Like title, this field’s value can be localized.
                type: string
              title:
                description: a short, human-readable summary of the problem that SHOULD NOT change from occurrence to occurrence of the problem, except for purposes of localization.
                type: string
            type: object
          type: array
      type: object
    EvidenceResponse:
      description: A JSON-API document with a single [EvidenceResource](#evidenceresource) resource
      properties:
        data:
          $ref: '#/components/schemas/EvidenceResource'
        included:
          description: Included resources
          items:
            properties:
              id:
                description: The JSON-API resource ID
                type: string
              type:
                description: The JSON-API resource type
                type: string
            type: object
          type: array
      required:
      - data
      type: object
  securitySchemes:
    Bearer:
      in: header
      name: Authorization
      type: apiKey
