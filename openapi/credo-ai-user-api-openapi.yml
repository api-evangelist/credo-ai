openapi: 3.2.0
info:
  description: Credo AI server API
  title: Credo AI server User API
servers:
- url: /api/v2/credoai
tags:
- name: user
  description: Endpoints related to user preferences and settings
paths:
  /me/recently_visited_use_cases:
    get:
      description: Retrieve a list of use cases that the user has recently interacted with.
      operationId: CredoAIWeb.API.V2.MeController.recently_visited_use_cases
      responses:
        '200':
          description: OK
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UseCasesResponse'
        '401':
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AuthError'
      security:
      - Bearer: []
      summary: ''
      tags:
      - user
  /me/setting/notification_preferences:
    patch:
      description: Update the notification preferences for the currently authenticated user.
      operationId: CredoAIWeb.API.V2.UserController.update_my_noti_setting
      responses:
        '200':
          description: OK
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AuthError'
      security:
      - Bearer: []
      summary: ''
      tags:
      - user
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/NotificationPreferencesRequest'
        description: data
  /me/setting:
    get:
      description: Retrieve the current settings for the authenticated user.
      operationId: CredoAIWeb.API.V2.UserController.show_my_setting
      responses:
        '200':
          description: OK
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UserSettingResponse'
        '401':
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AuthError'
      security:
      - Bearer: []
      summary: ''
      tags:
      - user
  /me:
    get:
      description: Fetch the details of the currently authenticated user.
      operationId: CredoAIWeb.API.V2.MeController.show
      parameters:
      - description: 'Included relationships. Available options:

          - setting (preloads user settings)

          - favorite_use_cases (includes favorite use cases)

          - recently_visited_use_cases (DEPRECATED: use /me/recently_visited_use_cases endpoint instead)

          '
        in: query
        name: include
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AuthError'
      security:
      - Bearer: []
      summary: ''
      tags:
      - user
    patch:
      description: Update the profile information of the currently authenticated user.
      operationId: CredoAIWeb.API.V2.UserController.update_me
      responses:
        '200':
          description: OK
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AuthError'
      security:
      - Bearer: []
      summary: ''
      tags:
      - user
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
        description: data
  /me/relationships/favorite_use_cases:
    patch:
      description: Modify the list of the user's favorite use cases.
      operationId: CredoAIWeb.API.V2.MeController.set_favorite_use_cases
      responses:
        '200':
          description: OK
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AuthError'
      security:
      - Bearer: []
      summary: ''
      tags:
      - user
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/MeUpdateFavoriteUseCasesRequest'
        description: Attributes for updating the user's favorite use cases.
  /me/teams:
    get:
      description: Retrieve a list of teams that the currently authenticated user is a member of.
      operationId: CredoAIWeb.API.V2.TeamController.my_teams
      responses:
        '200':
          description: OK
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/TeamsResponse'
        '401':
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AuthError'
      security:
      - Bearer: []
      summary: ''
      tags:
      - user
  /me/api_tokens:
    get:
      description: Retrieve a list of API tokens associated with the authenticated user.
      operationId: CredoAIWeb.API.V2.ApiTokenController.index
      responses:
        '200':
          description: OK
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ApiTokensResponse'
        '401':
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AuthError'
      security:
      - Bearer: []
      summary: ''
      tags:
      - user
    post:
      description: Generate a new API token for the authenticated user.
      operationId: CredoAIWeb.API.V2.ApiTokenController.create
      responses:
        '201':
          description: Created
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ApiTokenCreatedResponse'
        '401':
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AuthError'
      security:
      - Bearer: []
      summary: ''
      tags:
      - user
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/ApiTokenCreateRequest'
        description: The request body containing the details for the new API token.
  /me/tasks:
    get:
      description: Retrieve a list of tasks that are currently assigned to the authenticated user.
      operationId: CredoAIWeb.API.V2.TaskController.my_tasks
      parameters:
      - description: status match filter
        in: query
        name: filter[status]
        required: false
        x-example: in_progress
        schema:
          type: string
      - description: sort options
        in: query
        name: sort
        required: false
        x-example: -inserted_at,status
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/TasksResponse'
        '401':
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '404':
          description: Not Found
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
      security:
      - Bearer: []
      summary: ''
      tags:
      - user
  /me/api_tokens/{id}:
    delete:
      description: Remove the specified API token from the authenticated user's account.
      operationId: CredoAIWeb.API.V2.ApiTokenController.delete
      parameters:
      - description: The unique identifier of the API token to be deleted.
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '404':
          description: Not Found
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
      security:
      - Bearer: []
      summary: ''
      tags:
      - user
