    EvidenceResource:
      description: ''
      properties:
        attributes:
          properties:
            control_key:
              description: Control key
              example: FAIR.C1
              type: string
            creator:
              description: Creator
              example:
                family_name: John
                given_name: Doe
                nickname: doe
              type: object
            data:
              description: value data,
              example:
                value: value
              type: object
            entity_id:
              description: ''
              type: string
            generated_at:
              description: Evidence generation time
              example: '2015-05-22T14:56:29.000Z'
              type: string
            hash_key:
              description: ''
              type: string
            inserted_at:
