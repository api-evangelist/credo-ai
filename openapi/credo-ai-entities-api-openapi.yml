openapi: 3.2.0
info:
  description: Credo AI server API
  title: Credo AI server Entities API
servers:
- url: /api/v2/credoai
tags:
- name: entities
paths:
  /entities/{entity_id}/risk_classification:
    patch:
      description: Update the risk classification level of a specific entity.
      operationId: CredoAIWeb.API.V2.Entity.RiskClassificationController.update
      parameters:
      - description: The ID of the entity.
        in: path
        name: entity_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/EntityRiskClassificationResponse'
        '401':
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Forbidden
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Not Found
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
      security:
      - Bearer: []
      summary: ''
      tags:
      - entities
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/EntityRiskClassificationUpdateRequest'
        description: Risk classification update attributes.
components:
  schemas:
    EntityRiskClassificationResource:
      description: ''
      properties:
        attributes:
          properties:
            calculated_risk_score:
              description: ''
              type: string
            inserted_at:
              description: ''
              type: string
            risk_classification_id:
              description: ''
              type: string
            risk_classification_level:
              description: ''
              type: string
            risk_classification_set_at:
              description: ''
              type: string
            risk_classification_set_by:
              description: ''
              type: string
            risk_classification_set_by_user_id:
              description: ''
              type: string
            type:
              description: ''
              type: string
            updated_at:
              description: ''
              type: string
          type: object
        id:
          description: The JSON-API resource ID
          example: 64YUaLWSviHgibJaRWr3ZE
          type: string
        relationships:
          properties: {}
          type: object
        type:
          description: The JSON-API resource type
          example: entities
          type: string
      type: object
    EntityRiskClassificationUpdateRequest:
      description: ''
      properties:
        data:
          description: ''
          properties:
            attributes:
              properties:
                risk_classification_level:
                  description: Risk classification level
                  example: 1
                  type: integer
              type: object
            id:
              description: The JSON-API resource ID
              example: 64YUaLWSviHgibJaRWr3ZE
              type: string
            type:
              description: The JSON-API resource type
              example: resource-type
              type: string
          type: object
      type: object
    NotFoundError:
      properties:
        errors:
          description: Errors
          items:
            properties:
              code:
                description: an application-specific error code, expressed as a string value.
                type: integer
              detail:
                description: a human-readable explanation specific to this occurrence of the problem. Like title, this field’s value can be localized.
                type: string
              title:
                description: a short, human-readable summary of the problem that SHOULD NOT change from occurrence to occurrence of the problem, except for purposes of localization.
                type: string
            type: object
          type: array
      type: object
    EntityRiskClassificationResponse:
      description: A JSON-API document with a single [EntityRiskClassificationResource](#entityriskclassificationresource) resource
      properties:
        data:
          $ref: '#/components/schemas/EntityRiskClassificationResource'
        included:
          description: Included resources
          items:
            properties:
              id:
                description: The JSON-API resource ID
                type: string
              type:
                description: The JSON-API resource type
                type: string
            type: object
