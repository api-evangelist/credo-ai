      description: Cancel a specific attestation request associated with a report and entity.
      operationId: CredoAIWeb.API.V2.Entity.Report.AttestationRequestController.delete
      parameters:
      - description: The unique identifier of the entity.
        in: path
        name: entity_id
        required: true
        schema:
          type: string
      - description: The unique identifier of the report.
        in: path
        name: report_id
        required: true
        schema:
          type: string
      - description: The unique identifier of the attestation request to be canceled.
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Forbidden
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Not Found
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
      security:
      - Bearer: []
      summary: Credo AI web API V2 entity report attestation request controller delete
      tags:
      - Entities
      x-summary-source: derived
    patch:
      description: Update the status and/or comment of a specific attestation request.
      operationId: CredoAIWeb.API.V2.Entity.Report.AttestationRequestController.update
      parameters:
      - description: The unique identifier of the entity.
        in: path
        name: entity_id
        required: true
        schema:
          type: string
      - description: The unique identifier of the report.
        in: path
        name: report_id
        required: true
        schema:
          type: string
      - description: The unique identifier of the attestation request.
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/EntityReportAttestationRequestResponse'
        '401':
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Forbidden
          content:
            application/vnd.api+json:
