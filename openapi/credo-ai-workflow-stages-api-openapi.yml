openapi: 3.2.0
info:
  description: Credo AI server API
  title: Credo AI server Workflow Stages API
servers:
- url: /api/v2/credoai
tags:
- name: workflow_stages
paths:
  /api/v2/workflow_stages:
    get:
      description: List all workflow stages
      operationId: CredoAIWeb.API.V2.WorkflowStageController.index
      responses:
        '200':
          description: OK
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/WorkflowStage'
        '401':
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Forbidden
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
      security:
      - Bearer: []
      summary: ''
      tags:
      - workflow_stages
    post:
      description: Create a new workflow stage
      operationId: CredoAIWeb.API.V2.WorkflowStageController.create
      responses:
        '201':
          description: Created
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/WorkflowStage'
        '401':
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Forbidden
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
      security:
      - Bearer: []
      summary: ''
      tags:
      - workflow_stages
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/WorkflowStageCreateRequest'
        description: Stage attributes
        required: true
  /api/v2/workflow_stages/{id}:
    delete:
      description: Delete a workflow stage
      operationId: CredoAIWeb.API.V2.WorkflowStageController.delete
      parameters:
      - description: Stage ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Forbidden
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Not Found
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '422':
          description: Unprocessable entity
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UnprocessableEntityError'
      security:
      - Bearer: []
      summary: ''
      tags:
      - workflow_stages
    get:
      description: Get a specific workflow stage
      operationId: CredoAIWeb.API.V2.WorkflowStageController.show
      parameters:
      - description: Stage ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/WorkflowStagesResponse'
        '401':
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Forbidden
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
      security:
      - Bearer: []
      summary: ''
      tags:
      - workflow_stages
    patch:
      description: Update an existing workflow stage
      operationId: CredoAIWeb.API.V2.WorkflowStageController.update
      parameters:
      - description: Stage ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/WorkflowStage'
        '401':
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Forbidden
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Not Found
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
      security:
      - Bearer: []
      summary: ''
      tags:
      - workflow_stages
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/WorkflowStageUpdateRequest'
        description: Stage attributes
        required: true
components:
  schemas:
    WorkflowStageCreateRequest:
      description: ''
      properties:
        data:
          description: ''
          properties:
            attributes:
              properties:
                assessment_required:
                  description: true
                  type: boolean
                description:
                  description: ''
                  type: string
                evidence_collection_required:
                  description: true
                  type: boolean
                name:
                  description: ''
                  type: string
                parent_id:
                  description: ''
                  type: string
              required:
              - name
              - parent_id
              type: object
            type:
              description: The JSON-API resource type
              example: resource-type
              type: string
          type: object
      type: object
    AuthError:
      properties:
        errors:
          description: Errors
          items:
            properties:
              code:
                description: an application-specific error code, expressed as a string value.
                type: integer
              detail:
                description: a human-readable explanation specific to this occurrence of the problem. Like title, this field’s value can be localized.
                type: string
              title:
                description: a short, human-readable summary of the problem that SHOULD NOT change from occurrence to occurrence of the problem, except for purposes of localization.
                type: string
            type: object
          type: array
      type: object
    WorkflowStagesResponse:
      description: A page of [WorkflowStageResource](#workflowstageresource) results
      properties:
        data:
          description: Content with [WorkflowStageResource](#workflowstageresource) objects
          items:
            $ref: '#/components/schemas/WorkflowStageResource'
          type: array
        meta:
          properties:
            after:
              description: after cursor for the next page resources
              type: string
            before:
              description: before cursor for the previous page resources
              type: string
            limit:
              description: number of resources limit applied to this request
              type: integer
          type: object
      required:
      - data
      type: object
    UnprocessableEntityError:
      properties:
        errors:
          description: Errors
          items:
            properties:
              code:
                description: an application-specific error code, expressed as a string value.
                type: integer
              detail:
                description: a human-readable explanation specific to this occurrence of the problem. Like title, this field’s value can be localized.
                type: string
              title:
                description: a short, human-readable summary of the problem that SHOULD NOT change from occurrence to occurrence of the problem, except for purposes of localization.
                type: string
            type: object
          type: array
      type: object
    ForbiddenError:
      properties:
        errors:
          description: Errors
          items:
            properties:
              code:
                description: an application-specific error code, expressed as a string value.
                type: integer
              detail:
                description: a human-readable explanation specific to this occurrence of the problem. Like title, this field’s value can be localized.
                type: string
              title:
                description: a short, human-readable summary of the problem that SHOULD NOT change from occurrence to occurrence of the problem, except for purposes of localization.
                type: string
            type: object
          type: array
      type: object
    WorkflowStageResource:
      description: ''
      properties:
        attributes:
          properties:
            assessment_required:
              description: ''
              type: string
            child_id:
              description: ''
              type: string
            description:
              description: ''
              type: string
            evidence_collection_required:
              description: ''
              type: string
            id:
              description: ''
              type: string
            inserted_at:
              description: ''
              type: string
            name:
              description: ''
              type: string
            parent_id:
              description: ''
              type: string
            type:
              description: ''
              type: string
            updated_at:
              description: ''
              type: string
          type: object
        id:
          description: The JSON-API resource ID
          example: 64YUaLWSviHgibJaRWr3ZE
          type: string
        relationships:
          properties: {}
          type: object
        type:
          description: The JSON-API resource type
          example: workflow_stages
          type: string
      type: object
    NotFoundError:
      properties:
        errors:
          description: Errors
          items:
            properties:
              code:
                description: an application-specific error code, expressed as a string value.
                type: integer
              detail:
                description: a human-readable explanation specific to this occurrence of the problem. Like title, this field’s value can be localized.
                type: string
              title:
                description: a short, human-readable summary of the problem that SHOULD NOT change from occurrence to occurrence of the problem, except for purposes of localization.
                type: string
            type: object
          type: array
      type: object
    WorkflowStageUpdateRequest:
      description: ''
      properties:
        data:
          description: ''
          properties:
            attributes:
              properties:
                assessment_required:
                  description: true
                  type: boolean
                description:
                  description: ''
                  type: string
                evidence_collection_required:
                  description: true
                  type: boolean
                name:
                  description: ''
                  type: string
                parent_id:
                  description: ''
                  type: string
              type: object
            id:
              description: The JSON-API resource ID
              example: 64YUaLWSviHgibJaRWr3ZE
              type: string
            type:
              description: The JSON-API resource type
              example: resource-type
              type: string
          type: object
      type: object
  securitySchemes:
    Bearer:
      in: header
      name: Authorization
      type: apiKey
