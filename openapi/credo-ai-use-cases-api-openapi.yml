openapi: 3.2.0
info:
  description: Credo AI server API
  title: Credo AI server Use Cases API
servers:
- url: /api/v2/credoai
tags:
- name: use_cases
  description: Operations related to use cases
paths:
  /use_cases/{use_case_id}/stakeholders/{id}:
    delete:
      description: Remove a stakeholder from the specified use case.
      operationId: CredoAIWeb.API.V2.UseCase.StakeholderController.delete
      parameters:
      - description: The unique ID of the use case.
        in: path
        name: use_case_id
        required: true
        schema:
          type: string
      - description: The unique ID of the stakeholder to be deleted.
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Forbidden
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Not Found
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
      security:
      - Bearer: []
      summary: ''
      tags:
      - use_cases
    patch:
      description: Update the role of an existing stakeholder within the specified use case.
      operationId: CredoAIWeb.API.V2.UseCase.StakeholderController.update
      parameters:
      - description: The unique ID of the stakeholder to be updated.
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: The unique ID of the use case.
        in: path
        name: use_case_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UseCaseStakeholderResponse'
        '401':
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Forbidden
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Not Found
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
      security:
      - Bearer: []
      summary: ''
      tags:
      - use_cases
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UseCaseStakeholderUpdateRequest'
        description: The attributes to update for the stakeholder.
  /use_cases/{use_case_id}/evidences/{id}:
    delete:
      description: Deactivate a specific evidence item associated with a use case.
      operationId: CredoAIWeb.API.V2.UseCase.EvidenceController.delete
      parameters:
      - description: The unique ID of the use case.
        in: path
        name: use_case_id
        required: true
        schema:
          type: string
      - description: The unique ID of the evidence.
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: OK
        '401':
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Forbidden
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Not Found
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
      security:
      - Bearer: []
      summary: ''
      tags:
      - use_cases
    get:
      description: Retrieve detailed information about a specific evidence item.
      operationId: CredoAIWeb.API.V2.UseCase.EvidenceController.show
      parameters:
      - description: The unique ID of the use case.
        in: path
        name: use_case_id
        required: true
        schema:
          type: string
      - description: The unique ID of the evidence.
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/EvidenceResponse'
        '401':
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '404':
          description: Not Found
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
      security:
      - Bearer: []
      summary: ''
      tags:
      - use_cases
  /use_cases/{use_case_id}/stakeholders:
    get:
      description: Retrieve a list of all stakeholders associated with a specific use case.
      operationId: CredoAIWeb.API.V2.UseCase.StakeholderController.index
      parameters:
      - description: user,use_case,team
        in: query
        name: include
        required: false
        x-example: user,use_case,team
        schema:
          type: string
      - description: The unique ID of the use case.
        in: path
        name: use_case_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UseCasesStakeholdersResponse'
        '401':
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '404':
          description: Not Found
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
      security:
      - Bearer: []
      summary: ''
      tags:
      - use_cases
    post:
      description: Create a new stakeholder for the specified use case.
      operationId: CredoAIWeb.API.V2.UseCase.StakeholderController.create
      parameters:
      - description: The unique ID of the use case.
        in: path
        name: use_case_id
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Created
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UseCaseStakeholderResponse'
        '400':
          description: Bad Request
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UseCaseStakeholderAlreadyExistError'
        '401':
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Forbidden
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Not Found
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
      security:
      - Bearer: []
      summary: ''
      tags:
      - use_cases
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UseCaseStakeholderCreateRequest'
        description: The attributes of the stakeholder to be created.
  /use_cases/{id}:
    delete:
      description: Delete a specific use case. Only the owner of the use case can perform this action.
      operationId: CredoAIWeb.API.V2.UseCaseController.delete
      parameters:
      - description: Unique ID of the use case
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Forbidden
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Not Found
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
      security:
      - Bearer: []
      summary: ''
      tags:
      - use_cases
    get:
      description: Fetch detailed information about a specific use case identified by its ID.
      operationId: CredoAIWeb.API.V2.UseCaseController.show
      parameters:
      - description: Unique ID of the use case
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UseCaseResponse'
        '401':
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '404':
          description: Not Found
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
      security:
      - Bearer: []
      summary: ''
      tags:
      - use_cases
    patch:
      description: Update an existing use case identified by its ID.
      operationId: CredoAIWeb.API.V2.UseCaseController.update
      parameters:
      - description: Unique ID of the use case
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UseCaseResponse'
        '401':
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Forbidden
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Not Found
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
      security:
      - Bearer: []
      summary: ''
      tags:
      - use_cases
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UseCaseUpdateRequest'
        description: Attributes to update the use case
  /use_cases/{use_case_id}/step:
    patch:
      description: Update the workflow step of a specific use case.
      operationId: CredoAIWeb.API.V2.UseCaseController.update_workflow_step
      parameters:
      - description: Unique ID of the use case
        in: path
        name: use_case_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UseCaseResponse'
        '401':
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Forbidden
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
      security:
      - Bearer: []
      summary: ''
      tags:
      - use_cases
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UpdateWorkflowStepRequest'
        description: Workflow step attributes
  /use_cases/import:
    post:
      description: Import multiple use cases from a JSON file.
      operationId: CredoAIWeb.API.V2.UseCaseController.import
      responses:
        '201':
          description: Created
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UseCaseImportResponse'
        '207':
          description: Partial success in importing use cases
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UseCaseImportResponse'
        '401':
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Forbidden
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
      security:
      - Bearer: []
      summary: ''
      tags:
      - use_cases
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UseCasesImportRequest'
        description: Items to be imported as use cases
  /use_cases:
    get:
      description: Retrieve a list of all use cases.
      operationId: CredoAIWeb.API.V2.UseCaseController.index
      parameters:
      - description: page after cursor
        in: query
        name: page[after]
        required: false
        schema:
          type: string
      - description: page before cursor
        in: query
        name: page[before]
        required: false
        schema:
          type: string
      - description: page limit
        in: query
        name: page[limit]
        required: false
        schema:
          type: integer
      - description: name filter type
        in: query
        name: filter[name][type]
        required: false
        schema:
          type: string
      - description: name filter value
        in: query
        name: filter[name][value]
        required: false
        schema:
          type: string
      - description: id filter type
        in: query
        name: filter[id][type]
        required: false
        schema:
          type: string
      - description: id filter value
        in: query
        name: filter[id][value]
        required: false
        schema:
          type: string
      - description: sort options
        in: query
        name: sort
        required: false
        x-example: -inserted_at
        schema:
          type: string
      - description: domains
        in: query
        name: filter[domains][]
        required: false
        schema:
          type: string
      - description: ai_type
        in: query
        name: filter[ai_type][]
        required: false
        schema:
          type: string
      - description: in_review
        in: query
        name: filter[in_review][]
        required: false
        schema:
          type: string
      - description: is_vendor
        in: query
        name: filter[is_vendor][]
        required: false
        schema:
          type: string
      - description: policy pack key
        in: query
        name: filter[policy_pack_keys][]
        required: false
        schema:
          type: string
      - description: vendors
        in: query
        name: filter[vendors][]
        required: false
        schema:
          type: string
      - description: has_vendors
        in: query
        name: filter[has_vendors][]
        required: false
        schema:
          type: string
      - description: models
        in: query
        name: filter[models][]
        required: false
        schema:
          type: string
      - description: regions
        in: query
        name: filter[regions][]
        required: false
        schema:
          type: string
      - description: creator_id
        in: query
        name: filter[creator_id][]
        required: false
        schema:
          type: string
      - description: risk_classification_level
        in: query
        name: filter[risk_classification_level][]
        required: false
        schema:
          type: string
      - description: configurable_risk_score_classification
        in: query
        name: filter[configurable_risk_score_classification]
        required: false
        schema:
          type: string
      - description: custom_fields
        in: query
        name: filter[custom_fields][]
        required: false
        schema:
          type: string
      - description: use_case_number
        in: query
        name: filter[use_case_number][]
        required: false
        schema:
          type: string
      - description: has_active_reviewers
        in: query
        name: filter[has_active_reviewers][]
        required: false
        schema:
          type: string
      - description: has_scheduled_reviews
        in: query
        name: filter[has_scheduled_reviews][]
        required: false
        schema:
          type: string
      - description: has_alerts
        in: query
        name: filter[has_alerts][]
        required: false
        schema:
          type: string
      - description: reviewers
        in: query
        name: filter[reviewers][]
        required: false
        schema:
          type: string
      - description: scheduled_review_reviewers
        in: query
        name: filter[scheduled_review_reviewers][]
        required: false
        schema:
          type: string
      - description: workflow_stage_id
        in: query
        name: filter[workflow_stage_id][]
        required: false
        schema:
          type: string
      - description: workflow_stage_step
        in: query
        name: filter[workflow_stage_step][]
        required: false
        schema:
          type: string
      - description: q
        in: query
        name: filter[q][]
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UseCasesResponse'
        '401':
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AuthError'
      security:
      - Bearer: []
      summary: ''
      tags:
      - use_cases
    post:
      description: Create a new use case.
      operationId: CredoAIWeb.API.V2.UseCaseController.create
      responses:
        '201':
          description: Created
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UseCaseResponse'
        '401':
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Forbidden
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
      security:
      - Bearer: []
      summary: ''
      tags:
      - use_cases
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UseCaseCreateRequest'
        description: Attributes of the use case to be created
  /use_cases/{use_case_id}/workflow_stage:
    patch:
      description: Update the workflow stage of a specific use case.
      operationId: CredoAIWeb.API.V2.UseCaseController.update_workflow_stage
      parameters:
      - description: Unique ID of the use case
        in: path
        name: use_case_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UseCaseResponse'
        '401':
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Forbidden
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
      security:
      - Bearer: []
      summary: ''
      tags:
      - use_cases
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UpdateWorkflowStageRequest'
        description: Workflow stage attributes
  /use_cases/{use_case_id}/relationships/policy_controls:
    patch:
      description: Update the policy controls associated with a specific use case.
      operationId: CredoAIWeb.API.V2.UseCaseController.upgrade_policy_controls
      parameters:
      - description: Unique ID of the use case
        in: path
        name: use_case_id
        required: true
        schema:
          type: string
      responses:
        '201':
          description: OK
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UseCaseResponse'
        '401':
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Forbidden
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
      security:
      - Bearer: []
      summary: ''
      tags:
      - use_cases
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/ModifyPolicyPackRequest'
        description: Relationships to modify policy controls
  /use_cases/{use_case_id}/risk_classification:
    patch:
      description: Update the risk classification of a specific use case.
      operationId: CredoAIWeb.API.V2.UseCaseController.update_risk_classification
      parameters:
      - description: Unique ID of the use case
        in: path
        name: use_case_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UseCaseResponse'
        '401':
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Forbidden
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
      security:
      - Bearer: []
      summary: ''
      tags:
      - use_cases
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UpdateRiskClassificationRequest'
        description: Risk classification attributes
  /use_cases/{use_case_id}/vendor_links:
    get:
      description: Retrieve a list of vendor links associated with a specific use case.
      operationId: CredoAIWeb.API.V2.UseCase.VendorLinkController.index
      parameters:
      - description: The unique ID of the use case.
        in: path
        name: use_case_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UseCaseVendorLinksResponse'
        '401':
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AuthError'
      security:
      - Bearer: []
      summary: ''
      tags:
      - use_cases
    post:
      description: Create a new vendor link for a specific use case.
      operationId: CredoAIWeb.API.V2.UseCase.VendorLinkController.create
      parameters:
      - description: The unique ID of the use case.
        in: path
        name: use_case_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Created
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UseCaseVendorLinkResponse'
        '401':
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Forbidden
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Not Found
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
      security:
      - Bearer: []
      summary: ''
      tags:
      - use_cases
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UseCaseVendorLinkCreateRequest'
        description: The attributes for the new vendor link.
  /use_cases/{use_case_id}/relationships/models:
    delete:
      description: Removes models from the specified use case.
      operationId: CredoAIWeb.API.V2.UseCase.ModelController.remove_models
      parameters:
      - description: The unique ID of the use case.
        in: path
        name: use_case_id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/DatabaseError'
        '401':
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Forbidden
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Not Found
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
      security:
      - Bearer: []
      summary: ''
      tags:
      - use_cases
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UseCaseModelDeleteRelationships'
        description: The models to be removed from the use case.
    post:
      description: Adds models to the specified use case.
      operationId: CredoAIWeb.API.V2.UseCase.ModelController.add_models
      parameters:
      - description: The unique ID of the use case.
        in: path
        name: use_case_id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/DatabaseError'
        '401':
