openapi: 3.2.0
info:
  description: Credo AI server API
  title: Credo AI server Use Case Reports API
servers:
- url: /api/v2/credoai
tags:
- name: use_case_reports
  description: Operations related to reports for a specific use case, including creation, retrieval, and management of attestation requests
paths:
  /use_cases/{use_case_id}/reports/{report_id}/attestation_requests/{id}:
    delete:
      description: Cancel a specific attestation request associated with a report and use case.
      operationId: CredoAIWeb.API.V2.UseCase.Report.AttestationRequestController.delete
      parameters:
      - description: The unique identifier of the use case.
        in: path
        name: use_case_id
        required: true
        schema:
          type: string
      - description: The unique identifier of the report.
        in: path
        name: report_id
        required: true
        schema:
          type: string
      - description: The unique identifier of the attestation request to be canceled.
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Forbidden
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Not Found
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
      security:
      - Bearer: []
      summary: ''
      tags:
      - use_case_reports
  /use_cases/{use_case_id}/reports/{id}:
    delete:
      description: Delete a report and its associated widgets.
      operationId: CredoAIWeb.API.V2.UseCase.ReportController.delete
      parameters:
      - description: The unique ID of the use case.
        in: path
        name: use_case_id
        required: true
        schema:
          type: string
      - description: The unique ID of the report.
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Forbidden
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Not Found
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
      security:
      - Bearer: []
      summary: ''
      tags:
      - use_case_reports
    get:
      description: Fetch detailed information about a specific report with widget data.
      operationId: CredoAIWeb.API.V2.UseCase.ReportController.show
      parameters:
      - description: The unique ID of the use case.
        in: path
        name: use_case_id
        required: true
        schema:
          type: string
      - description: The unique ID of the report.
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ReportResponse'
        '401':
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '404':
          description: Not Found
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
      security:
      - Bearer: []
      summary: ''
      tags:
      - use_case_reports
    patch:
      description: Update report metadata (name, description). Structure cannot be changed after creation.
      operationId: CredoAIWeb.API.V2.UseCase.ReportController.update
      parameters:
      - description: The unique ID of the use case.
        in: path
        name: use_case_id
        required: true
        schema:
          type: string
      - description: The unique ID of the report.
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ReportResponse'
        '401':
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Forbidden
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Not Found
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
      security:
      - Bearer: []
      summary: ''
      tags:
      - use_case_reports
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/ReportUpdateRequest'
        description: The attributes to update.
  /use_cases/{use_case_id}/reports/{report_id}/attestation_requests:
    post:
      description: Create a new attestation request for a specific report associated with a use case.
      operationId: CredoAIWeb.API.V2.UseCase.Report.AttestationRequestController.create
      parameters:
      - description: The unique identifier of the use case.
        in: path
        name: use_case_id
        required: true
        schema:
          type: string
      - description: The unique identifier of the report.
        in: path
        name: report_id
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Created
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ReportAttestationRequestResponse'
        '401':
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Forbidden
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
      security:
      - Bearer: []
      summary: ''
      tags:
      - use_case_reports
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/ReportAttestationRequestCreateRequest'
        description: The attributes for the new attestation request.
  /use_cases/{use_case_id}/reports/{report_id}/snapshot:
    get:
      description: Retrieve the snapshot data for a specific report associated with a use case.
      operationId: CredoAIWeb.API.V2.UseCase.ReportController.show_snapshot
      parameters:
      - description: The unique ID of the use case.
        in: path
        name: use_case_id
        required: true
        schema:
          type: string
      - description: The unique ID of the report.
        in: path
        name: report_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UseCaseSnapshotResponse'
        '401':
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '404':
          description: Not Found
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
      security:
      - Bearer: []
      summary: ''
      tags:
      - use_case_reports
  /use_cases/{use_case_id}/reports:
    get:
      description: Retrieve a list of reports associated with a specific use case.
      operationId: CredoAIWeb.API.V2.UseCase.ReportController.index
      parameters:
      - description: policy_pack_key match filter
        in: query
        name: filter[policy_pack_key]
        required: false
        schema:
          type: string
      - description: template_id match filter
        in: query
        name: filter[template_id]
        required: false
        schema:
          type: string
      - description: report_type match filter
        in: query
        name: filter[report_type]
        required: false
        schema:
          type: string
      - description: sort options
        in: query
        name: sort
        required: false
        x-example: -inserted_at
        schema:
          type: string
      - description: The unique ID of the use case.
        in: path
        name: use_case_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ReportsResponse'
        '401':
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AuthError'
      security:
      - Bearer: []
      summary: ''
      tags:
      - use_case_reports
    post:
      description: Create a new report. Use template_id for template-based reports or policy_pack_key for legacy reports.
      operationId: CredoAIWeb.API.V2.UseCase.ReportController.create
      parameters:
      - description: The unique ID of the use case.
        in: path
        name: use_case_id
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Created
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ReportResponse'
        '401':
          description: Unauthorized
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Forbidden
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
      security:
      - Bearer: []
      summary: ''
      tags:
      - use_case_reports
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/ReportCreateRequest'
        description: The attributes for the new report.
