headline_finding: >-
  The MCP server and the REST API are NOT two projections of one core. The
  governance-hub MCP reads the CANONICAL, cross-tenant Credo AI Governance
  Intelligence catalog — the risk/control/policy-requirement taxonomy and the
  maturity framework Credo AI authors — while the v2 REST API operates on a
  SINGLE CUSTOMER TENANT's instantiation of that taxonomy. Every MCP tool is
  therefore mcp_only, and 300 of 311 REST operations are rest_only. An agent
  cannot reach the catalog over REST, and cannot write a use case over MCP.
crosswalk:
- tool: governance_query
  category: catalog-search
  rest: []
  binding: none
  confidence: high
  note: >-
    Nearest REST neighbours are CredoAIWeb.API.V2.PolicyControlController.index,
    CredoAIWeb.API.V2.RiskScenarioController.index and
    CredoAIWeb.API.V2.RiskTypeController.index, but those list the controls and
    risk scenarios already attached to the caller's tenant. They are not a
    semantic search over the master catalog and cannot substitute.
- tool: get_entities
  category: catalog-read
  rest: []
  binding: none
  confidence: high
  note: >-
    Tenant-scoped analogues exist
    (CredoAIWeb.API.V2.PolicyControlController.show,
    CredoAIWeb.API.V2.RiskScenarioController.show,
    CredoAIWeb.API.V2.PolicyPackController.show) but they resolve tenant IDs, not
    catalog result_ids returned by governance_query.
- tool: get_catalog_overview
  category: capability-probe
  rest: []
  binding: none
  confidence: high
  note: >-
    A connection/feature probe with no REST equivalent. The closest REST call is
    CredoAIWeb.API.V2.TenantInfoController.show, which describes the tenant rather
    than the catalog.
- tool: get_maturity_framework
  category: framework
  rest: []
  binding: none
  confidence: high
  note: >-
    Pro-entitled and metered. The maturity framework is not exposed anywhere in
    either OpenAPI document.
- tool: get_benchmarks
  category: benchmarks
  rest: []
  binding: none
  confidence: high
  note: Pro-entitled and metered. No REST equivalent in either OpenAPI document.
