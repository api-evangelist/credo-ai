apis:
- name: Credo AI Governance Intelligence Pro MCP Server
  description: >-
    Provider-published Model Context Protocol server ("governance-hub") distributed as the npm package
    @credoai/governance-hub-mcp and run over stdio via npx. Grounds the Credo AI Claude Code Agent Skills
    in the live Credo AI Governance Intelligence catalog with five documented tools — get_catalog_overview,
    governance_query, get_entities, get_maturity_framework, get_benchmarks. Access credentials are gated;
    the npm package is not resolvable on the public registry.
  humanURL: https://github.com/credo-ai/credoai-plugins
  baseURL: npx -y @credoai/governance-hub-mcp
  tags:
  - MCP
  - AI Governance
  - Agent Skills
  tags_raw:
  - mcp
  - ai-governance
