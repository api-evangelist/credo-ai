aid: credo-ai
name: Credo AI
description: >-
  Credo AI is an enterprise AI governance, risk, and compliance platform used to discover, register,
  risk-classify, and continuously govern every AI model, application, agent, and third-party AI vendor
  an organization runs. The platform pairs an AI Registry (use cases, models, vendors, agents, shadow-AI
  discovery) with a policy engine that turns regulatory frameworks — the EU AI Act, NIST AI RMF, ISO/IEC
  42001, NYC Local Law 144, Colorado SB21-169, OMB M-25 — into machine-enforced policy packs, controls,
  questionnaires, risk scenarios, and audit-ready evidence artifacts. Programmatic access is delivered
  through a multi-tenant JSON:API REST surface at api.credo.ai (300 operations across use cases, models,
  vendors, questionnaires, policy packs, policy controls, risks, tasks, teams, users, triggers, and
  Shadow AI), a first-party Python SDK (pycredoai) and TypeScript SDK (@credo-ai/sdk), and a published
  Claude Code plugin marketplace of eleven AI-governance Agent Skills backed by a gated Governance
  Intelligence Pro MCP server.
