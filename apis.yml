apis:
- name: Credo AI Governance Platform API (v2)
  description: >-
    Multi-tenant JSON:API REST interface to the Credo AI Governance Platform. 300 operations across 26
    tags cover use cases, use case questionnaires, risk scenarios, controls, policy packs, reports,
    reviews, comments and custom fields, plus models and model versions, vendors, questionnaires,
    policy controls, risk classifications, tasks, fields, users, teams, triggers and trigger actions,
    and Shadow AI tools and events. Media type is application/vnd.api+json throughout, with cursor
    pagination (page[after]/page[before]/page[limit]), filter[...]/sort/include query conventions, and
    a JSON:API errors[] envelope. Authenticated with a Bearer token exchanged from a tenant API token.
  humanURL: https://docs.sdk.credo.ai/docs/intro/
  baseURL: https://api.credo.ai/api/v2/{tenant}
  tags:
  - ai-governance
  - ai-risk-management
  - compliance
  - model-registry
  - vendor-risk
  - json-api
  properties:
