- name: Credo AI Audit Logs & Shadow AI API
  description: >-
    OpenAPI 3.0.0 contract covering the audit-log and Shadow AI slice of the Credo AI v2 API — listing,
    filtering, exporting and retrieving audit log entries, and ingesting, listing, bulk-loading and
    deleting Shadow AI events plus registering and unregistering discovered AI tools. Declares four
    servers (local, QA, production, on-premise), each templated on the customer tenant identifier, and
    a BearerAuth JWT security scheme obtained from POST /auth/exchange.
  humanURL: https://api.credo.ai/openapi
  baseURL: https://api.credo.ai/api/v2/{tenant}
  tags:
  - audit
  - shadow-ai
  - ai-governance
  - compliance
  properties:
  - type: OpenAPI
    url: openapi/credo-ai-audit-logs-shadow-ai-openapi.json
  - type: Documentation
    url: https://api.credo.ai/openapi
  - type: Overlay
    url: overlays/credo-ai-audit-logs-shadow-ai-overlay.yaml
- name: Credo AI Governance Intelligence Pro MCP Server
  description: >-
    Provider-published Model Context Protocol server ("governance-hub") distributed as the npm package
    @credoai/governance-hub-mcp and run over stdio via npx. Grounds the Credo AI Claude Code Agent
    Skills in the live Credo AI Governance Intelligence catalog with five documented tools —
    get_catalog_overview, governance_query, get_entities, get_maturity_framework, get_benchmarks.
    Access credentials are gated; the npm package is not resolvable on the public registry.
  humanURL: https://github.com/credo-ai/credoai-plugins
  baseURL: npx -y @credoai/governance-hub-mcp
  tags:
  - mcp
  - ai-governance
  - agent-skills
  properties:
  - type: MCPServer
    url: mcp/credo-ai-mcp.yml
  - type: ToolCrosswalk
    url: mcp/credo-ai-tool-crosswalk.yml
  - type: Documentation
    url: https://github.com/credo-ai/credoai-plugins
